<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Links by Keywords</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Open Links by Keywords</h1>

    <div id="historySection" class="history-section" style="display: none;">
      <div class="history-header">
        <span class="history-title">Recent Searches:</span>
        <button id="clearHistoryBtn" class="clear-history-btn">Clear</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </div>

    <div class="search-section">
      <div class="search-label-row">
        <label for="keywords">Enter keywords:</label>
        <span class="help-text">Use AND/OR for logic. Use quotes for exact phrases.</span>
      </div>
      <input
        type="text"
        id="keywords"
        placeholder='e.g., "github" AND "repository" OR "docs"'
        autocomplete="off"
      >
      <button id="searchBtn">Search Links</button>
    </div>

    <div id="resultsSection" class="results-section" style="display: none;">
      <div class="results-header-row">
        <h2>Found <span id="linkCount">0</span> link(s)</h2>
        <div class="select-controls">
          <button id="selectAllBtn">Select All</button>
          <button id="deselectAllBtn">Deselect All</button>
        </div>
      </div>

      <div id="linksList" class="links-list"></div>

      <div class="actions-section">
        <div class="open-as">
          <label>Open as:</label>
          <label class="radio-label">
            <input type="radio" name="openAs" value="tabs" checked>
            Tabs
          </label>
          <label class="radio-label">
            <input type="radio" name="openAs" value="windows">
            Windows
          </label>
        </div>
        <button id="openAllBtn" class="open-all-btn" disabled>Open Selected Links</button>
      </div>
    </div>

    <div id="noResults" class="no-results" style="display: none;">
      No links found matching your criteria.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
